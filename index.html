    <title>Intervalli Quiz - Allena il tuo orecchio musicale</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #047857 0%, #10b981 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            color: white;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(6, 78, 59, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #34d399, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scale-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .scale-select-wrapper {
            flex: 1;
        }

        .scale-select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 46px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .scale-select:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .scale-select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .scale-select option {
            background: #1e293b;
            color: white;
        }

        .btn {
            flex: 1;
            padding: 12px;
            background: rgba(167, 139, 250, 0.2);
            border: 2px solid rgba(167, 139, 250, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            height: 46px;
        }

        .btn:hover {
            background: rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
        }

        .interval-distance-btn {
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid rgba(34, 197, 94, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .interval-distance-btn:hover {
            background: rgba(34, 197, 94, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9em;
            gap: 15px;
            flex-wrap: wrap;
        }

        .scale-name {
            color: #34d399;
            font-weight: bold;
            font-size: 1.1em;
        }

        .score-stats {
            display: flex;
            gap: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .quiz-area {
            height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Stile scrollbar per webkit browsers */
        .quiz-area::-webkit-scrollbar {
            width: 8px;
        }

        .quiz-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .quiz-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .quiz-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .start-message {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        .intervals-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .interval-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 5px;
        }

        .interval-label {
            width: 100%;
            padding: 5px 2px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px 8px 0 0;
            text-align: center;
            font-weight: bold;
            font-size: 0.8em;
        }

        .interval-label.double-note {
            background: rgba(96, 165, 250, 0.15);
            border-color: rgba(96, 165, 250, 0.3);
            font-size: 0.9em;
        }

        .interval-input {
            width: 100%;
            padding: 8px 2px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 8px 8px;
            color: white;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .interval-input.active {
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        .interval-input.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
            color: #22c55e;
        }

        .interval-input.incorrect {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        .interval-input.show-answer {
            background: rgba(251, 191, 36, 0.3);
            border-color: #fbbf24;
            color: #fbbf24;
            font-size: 0.85em;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .virtual-keyboard {
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .keyboard-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            justify-content: center;
        }
        
        .keyboard-row:last-child {
            margin-bottom: 0;
        }

        .key-btn {
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 38px;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: translateY(0);
            background: rgba(96, 165, 250, 0.3);
        }

        .key-btn.note {
            background: rgba(96, 165, 250, 0.2);
            border-color: rgba(96, 165, 250, 0.4);
            padding: 8px 10px;
            min-width: 35px;
            font-size: 13px;
        }

        .key-btn.accidental {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.4);
            padding: 8px 10px;
            min-width: 35px;
            font-size: 13px;
        }

        .key-btn.interval {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
            padding: 8px;
            min-width: 36px;
            font-size: 13px;
        }

        .key-btn.action {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            padding: 8px 10px;
            font-size: 13px;
        }

        .key-btn.enter {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
            padding: 8px 15px;
            font-size: 13px;
        }

        .current-input {
            text-align: center;
            margin-bottom: 10px;
            font-size: 20px;
            color: #60a5fa;
            min-height: 32px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 2px solid rgba(96, 165, 250, 0.3);
        }

        .nav-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .complete-btn {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
        }

        .complete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Intervalli Quiz</h1>
        
        <div class="scale-selector" id="scaleSelector">
            <div class="scale-select-wrapper">
                <select class="scale-select" id="scaleSelect">
                    <option value="">Seleziona una scala...</option>
                    <option value="C">C maggiore</option>
                    <option value="G">G maggiore</option>
                    <option value="D">D maggiore</option>
                    <option value="A">A maggiore</option>
                    <option value="E">E maggiore</option>
                    <option value="B">B maggiore</option>
                    <option value="F#">F# maggiore</option>
                    <option value="F">F maggiore</option>
                    <option value="Bb">Bb maggiore</option>
                    <option value="Eb">Eb maggiore</option>
                    <option value="Ab">Ab maggiore</option>
                    <option value="Db">Db maggiore</option>
                    <option value="Gb">Gb maggiore</option>
                </select>
            </div>
            <button class="btn" id="randomBtn">
                🎲 Scala Casuale
            </button>
        </div>

        <button class="interval-distance-btn" id="intervalDistanceBtn">
            🎹 Distanza Intervalli
        </button>
        
        <div class="score-container">
            <span class="scale-name hidden" id="scaleName"></span>
            <div class="score-stats">
                <span>Completate: <strong id="completed">0</strong>/100</span>
                <span>Corrette: <strong id="score">0</strong>/100</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-area" id="quizArea">
            <div class="start-message">
                Seleziona una scala o clicca su "Scala Casuale" per iniziare
            </div>
        </div>

        <button class="start-btn hidden" id="startBtn">
            🚀 Inizia Quiz
        </button>

        <div class="virtual-keyboard" id="virtualKeyboard">
            <div class="current-input" id="currentInput">_</div>
            
            <div class="keyboard-row keyboard-notes hidden">
                <button class="key-btn note" data-note="C">C</button>
                <button class="key-btn note" data-note="D">D</button>
                <button class="key-btn note" data-note="E">E</button>
                <button class="key-btn note" data-note="F">F</button>
                <button class="key-btn note" data-note="G">G</button>
                <button class="key-btn note" data-note="A">A</button>
                <button class="key-btn note" data-note="B">B</button>
            </div>
            
            <div class="keyboard-row keyboard-notes hidden">
                <button class="key-btn accidental" data-note="#">#</button>
                <button class="key-btn accidental" data-note="b">b</button>
                <button class="key-btn action" data-action="clear">⌫</button>
                <button class="key-btn enter" data-action="enter">✓ OK</button>
            </div>

            <div class="keyboard-row keyboard-intervals">
                <button class="key-btn interval" data-interval="1">1</button>
                <button class="key-btn interval" data-interval="b2">b2</button>
                <button class="key-btn interval" data-interval="2">2</button>
                <button class="key-btn interval" data-interval="b3">b3</button>
                <button class="key-btn interval" data-interval="3">3</button>
                <button class="key-btn interval" data-interval="4">4</button>
            </div>
            
            <div class="keyboard-row keyboard-intervals">
                <button class="key-btn interval" data-interval="b5">b5</button>
                <button class="key-btn interval" data-interval="5">5</button>
                <button class="key-btn interval" data-interval="#5">#5</button>
                <button class="key-btn interval" data-interval="6">6</button>
                <button class="key-btn interval" data-interval="b7">b7</button>
                <button class="key-btn interval" data-interval="7">7</button>
            </div>
            
            <div class="keyboard-row keyboard-intervals">
                <button class="key-btn action" data-action="clear">⌫</button>
                <button class="key-btn enter" data-action="enter">✓ OK</button>
            </div>
        </div>

        <div class="nav-btns hidden" id="navBtns">
            <button class="nav-btn back-btn" id="backBtn">
                ← Torna al Menu
            </button>
            <button class="nav-btn complete-btn" id="completeBtn" disabled>
                Termina Quiz
            </button>
        </div>
    </div>

    <script>
        var scales = {
            'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G': ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
            'D': ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
            'A': ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
            'E': ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
            'B': ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'],
            'F': ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
            'Gb': ['Gb', 'Ab', 'Bb', 'Cb', 'Db', 'Eb', 'F'],
            'F#': ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#']
        };

        var chromaticNotes = ['C', 'C#/Db', 'D', 'D#/Eb', 'E', 'F', 'F#/Gb', 'G', 'G#/Ab', 'A', 'A#/Bb', 'B'];
        var intervalTypes = ['1', 'b2', '2', 'b3', '3', '4', 'b5', '5', '#5', '6', 'b7', '7'];
        var semitonesMap = {
            '1': 0, 'b2': 1, '2': 2, 'b3': 3, '3': 4, '4': 5,
            'b5': 6, '5': 7, '#5': 8, '6': 9, 'b7': 10, '7': 11
        };
        
        var currentScale = '';
        var currentMode = 'scale-intervals';
        var totalScore = 0;
        var totalCompleted = 0;
        var quizData = [];
        var currentActiveInput = null;
        var currentInputValue = '';
        var autoAdvanceTimer = null;

        document.getElementById('scaleSelect').addEventListener('change', function() {
            var selected = this.value;
            if (selected) {
                currentScale = selected;
                currentMode = 'scale-intervals';
                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('quizArea').innerHTML = 
                    '<div class="start-message">' +
                        'Premi "Inizia Quiz" per cominciare con la scala di ' + currentScale + ' maggiore' +
                    '</div>';
            }
        });

        document.getElementById('randomBtn').addEventListener('click', function() {
            var keys = Object.keys(scales);
            currentScale = keys[Math.floor(Math.random() * keys.length)];
            currentMode = 'scale-intervals';
            document.getElementById('scaleSelect').value = currentScale;
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('quizArea').innerHTML = 
                '<div class="start-message">' +
                    'Premi "Inizia Quiz" per cominciare con la scala di ' + currentScale + ' maggiore' +
                '</div>';
        });

        document.getElementById('intervalDistanceBtn').addEventListener('click', function() {
            currentMode = 'interval-distance';
            currentScale = '';
            totalScore = 0;
            totalCompleted = 0;
            document.getElementById('completed').textContent = '0';
            document.getElementById('score').textContent = '0';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('scaleSelect').value = '';
            generateIntervalDistanceQuiz();
            displayQuiz();
            document.getElementById('scaleSelector').classList.add('hidden');
            document.getElementById('intervalDistanceBtn').classList.add('hidden');
            document.getElementById('navBtns').classList.remove('hidden');
            document.getElementById('scaleName').textContent = 'Distanza Intervalli';
            document.getElementById('scaleName').classList.remove('hidden');
        });

        document.getElementById('startBtn').addEventListener('click', function() {
            totalScore = 0;
            totalCompleted = 0;
            document.getElementById('completed').textContent = '0';
            document.getElementById('score').textContent = '0';
            document.getElementById('progressFill').style.width = '0%';
            generateScaleQuiz();
            displayQuiz();
            this.classList.add('hidden');
            document.getElementById('navBtns').classList.remove('hidden');
            document.getElementById('scaleSelector').classList.add('hidden');
            document.getElementById('intervalDistanceBtn').classList.add('hidden');
            document.getElementById('scaleName').textContent = 'Scala: ' + currentScale + ' maggiore';
            document.getElementById('scaleName').classList.remove('hidden');
        });

        document.getElementById('backBtn').addEventListener('click', function() {
            if (confirm('Vuoi tornare al menu? Perderai i progressi attuali.')) {
                location.reload();
            }
        });

        document.getElementById('completeBtn').addEventListener('click', function() {
            alert('Quiz completato!\nPunteggio: ' + totalScore + '/100\nPercentuale: ' + totalScore + '%');
            location.reload();
        });

        // Keyboard handlers
        var keyButtons = document.querySelectorAll('.key-btn');
        for (var i = 0; i < keyButtons.length; i++) {
            keyButtons[i].addEventListener('click', function() {
                if (!currentActiveInput) return;
                
                var note = this.dataset.note;
                var interval = this.dataset.interval;
                var action = this.dataset.action;
                
                if (currentMode === 'scale-intervals') {
                    if (note) {
                        if (note === '#' || note === 'b') {
                            if (currentInputValue.length === 1 && currentInputValue.indexOf('#') === -1 && currentInputValue.indexOf('b') === -1) {
                                currentInputValue += note;
                                updateDisplay();
                                
                                clearTimeout(autoAdvanceTimer);
                                autoAdvanceTimer = setTimeout(function() {
                                    if (currentActiveInput) {
                                        var index = parseInt(currentActiveInput.id.split('-')[1]);
                                        checkAnswer(index);
                                    }
                                }, 300);
                            }
                        } else {
                            currentInputValue = note;
                            updateDisplay();
                            
                            clearTimeout(autoAdvanceTimer);
                            autoAdvanceTimer = setTimeout(function() {
                                if (currentInputValue.length === 1 && currentActiveInput) {
                                    var index = parseInt(currentActiveInput.id.split('-')[1]);
                                    checkAnswer(index);
                                }
                            }, 1500);
                        }
                    }
                } else if (currentMode === 'interval-distance') {
                    if (interval) {
                        currentInputValue = interval;
                        updateDisplay();
                        
                        clearTimeout(autoAdvanceTimer);
                        autoAdvanceTimer = setTimeout(function() {
                            if (currentActiveInput) {
                                var index = parseInt(currentActiveInput.id.split('-')[1]);
                                checkAnswer(index);
                            }
                        }, 300);
                    }
                }
                
                if (action === 'clear') {
                    currentInputValue = '';
                    updateDisplay();
                    clearTimeout(autoAdvanceTimer);
                } else if (action === 'enter') {
                    if (currentInputValue && currentActiveInput) {
                        clearTimeout(autoAdvanceTimer);
                        var index = parseInt(currentActiveInput.id.split('-')[1]);
                        checkAnswer(index);
                    }
                }
            });
        }

        function updateDisplay() {
            document.getElementById('currentInput').textContent = currentInputValue || '_';
            if (currentActiveInput) {
                currentActiveInput.textContent = currentInputValue;
            }
        }

        function getNoteIndex(note) {
            var noteMap = {
                'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
                'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8,
                'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
            };
            return noteMap[note];
        }

        function calculateIntervalFromNotes(note1, note2) {
            var index1 = getNoteIndex(note1);
            var index2 = getNoteIndex(note2);
            var semitones = (index2 - index1 + 12) % 12;
            
            var intervalMap = {
                0: '1', 1: 'b2', 2: '2', 3: 'b3', 4: '3', 5: '4',
                6: 'b5', 7: '5', 8: '#5', 9: '6', 10: 'b7', 11: '7'
            };
            
            return intervalMap[semitones];
        }

        function getRandomNote() {
            var notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            return notes[Math.floor(Math.random() * notes.length)];
        }

        function generateIntervalDistanceQuiz() {
            quizData = [];
            for (var i = 0; i < 100; i++) {
                var note1 = getRandomNote();
                var note2 = getRandomNote();
                while (note1 === note2) {
                    note2 = getRandomNote();
                }
                
                var interval = calculateIntervalFromNotes(note1, note2);
                var semitones = semitonesMap[interval];
                
                quizData.push({
                    note1: note1,
                    note2: note2,
                    answer: interval,
                    semitones: semitones,
                    userAnswer: '',
                    completed: false
                });
            }
        }

        function generateScaleQuiz() {
            quizData = [];
            for (var i = 0; i < 100; i++) {
                var interval = intervalTypes[Math.floor(Math.random() * intervalTypes.length)];
                quizData.push({
                    interval: interval,
                    answer: calculateInterval(currentScale, interval),
                    userAnswer: '',
                    completed: false
                });
            }
        }

        function calculateInterval(scaleName, interval) {
            var scale = scales[scaleName];
            
            if (interval === '1') return scale[0];
            if (interval === '2') return scale[1];
            if (interval === '3') return scale[2];
            if (interval === '4') return scale[3];
            if (interval === '5') return scale[4];
            if (interval === '6') return scale[5];
            if (interval === '7') return scale[6];
            
            if (interval === 'b2') return flatNote(scale[1]);
            if (interval === 'b3') return flatNote(scale[2]);
            if (interval === 'b5') return flatNote(scale[4]);
            if (interval === '#5') return sharpNote(scale[4]);
            if (interval === 'b7') return flatNote(scale[6]);
            
            return scale[0];
        }

        function sharpNote(note) {
            if (note.indexOf('#') !== -1) return note.charAt(0) + '##';
            if (note.indexOf('b') !== -1) return note.charAt(0);
            if (note === 'E') return 'F';
            if (note === 'B') return 'C';
            return note + '#';
        }

        function flatNote(note) {
            if (note.indexOf('b') !== -1) return note.charAt(0) + 'bb';
            if (note.indexOf('#') !== -1) return note.charAt(0);
            if (note === 'C') return 'B';
            if (note === 'F') return 'E';
            return note + 'b';
        }

        function displayQuiz() {
            var area = document.getElementById('quizArea');
            area.innerHTML = '';
            
            var grid = document.createElement('div');
            grid.className = 'intervals-grid';
            
            for (var i = 0; i < quizData.length; i++) {
                var quiz = quizData[i];
                var group = document.createElement('div');
                group.className = 'interval-group';
                
                var label = document.createElement('div');
                label.className = 'interval-label';
                
                if (currentMode === 'scale-intervals') {
                    label.textContent = quiz.interval;
                } else {
                    label.className += ' double-note';
                    label.textContent = quiz.note1 + ' → ' + quiz.note2;
                }
                
                var input = document.createElement('div');
                input.className = 'interval-input';
                input.id = 'input-' + i;
                input.textContent = '';
                input.tabIndex = 0;
                
                input.addEventListener('click', (function(index) {
                    return function() {
                        if (!quizData[index].completed) {
                            activateInput(this, index);
                        }
                    };
                })(i));
                
                group.appendChild(label);
                group.appendChild(input);
                grid.appendChild(group);
            }
            
            area.appendChild(grid);
            document.getElementById('virtualKeyboard').style.display = 'block';
            
            // Show/hide appropriate keyboard
            var noteKeyboards = document.querySelectorAll('.keyboard-notes');
            var intervalKeyboards = document.querySelectorAll('.keyboard-intervals');
            
            if (currentMode === 'scale-intervals') {
                for (var j = 0; j < noteKeyboards.length; j++) {
                    noteKeyboards[j].classList.remove('hidden');
                }
                for (var k = 0; k < intervalKeyboards.length; k++) {
                    intervalKeyboards[k].classList.add('hidden');
                }
            } else {
                for (var j = 0; j < noteKeyboards.length; j++) {
                    noteKeyboards[j].classList.add('hidden');
                }
                for (var k = 0; k < intervalKeyboards.length; k++) {
                    intervalKeyboards[k].classList.remove('hidden');
                }
            }
            
            setTimeout(function() {
                var firstInput = document.getElementById('input-0');
                if (firstInput) {
                    activateInput(firstInput, 0);
                }
            }, 100);
        }

        function activateInput(input, index) {
            var inputs = document.querySelectorAll('.interval-input');
            for (var i = 0; i < inputs.length; i++) {
                inputs[i].classList.remove('active');
            }
            
            if (!quizData[index].completed) {
                input.classList.add('active');
                currentActiveInput = input;
                currentInputValue = input.textContent || '';
                document.getElementById('currentInput').textContent = currentInputValue || '_';
            }
        }

        function checkAnswer(index) {
            var input = document.getElementById('input-' + index);
            var userAnswer = currentInputValue.trim();
            var correct = quizData[index].answer;
            var isCorrect = false;
            
            if (currentMode === 'scale-intervals') {
                var enharmonics = {
                    'C#': 'Db', 'Db': 'C#',
                    'D#': 'Eb', 'Eb': 'D#',
                    'F#': 'Gb', 'Gb': 'F#',
                    'G#': 'Ab', 'Ab': 'G#',
                    'A#': 'Bb', 'Bb': 'A#',
                    'E#': 'F', 'F': 'E#',
                    'B#': 'C', 'C': 'B#',
                    'Cb': 'B', 'B': 'Cb',
                    'Fb': 'E', 'E': 'Fb'
                };
                
                isCorrect = userAnswer === correct || 
                           (enharmonics[userAnswer] === correct) || 
                           (enharmonics[correct] === userAnswer);
            } else {
                isCorrect = userAnswer === correct;
            }
            
            if (isCorrect) {
                input.classList.add('correct');
                input.classList.remove('active');
                totalScore++;
                document.getElementById('score').textContent = totalScore;
            } else {
                input.classList.add('incorrect');
                input.classList.remove('active');
                setTimeout(function() {
                    input.classList.remove('incorrect');
                    input.classList.add('show-answer');
                    if (currentMode === 'interval-distance') {
                        input.textContent = correct + ' (' + quizData[index].semitones + ' st)';
                    } else {
                        input.textContent = correct;
                    }
                }, 1000);
            }
            
            quizData[index].completed = true;
            totalCompleted++;
            currentActiveInput = null;
            currentInputValue = '';
            document.getElementById('currentInput').textContent = '_';
            
            document.getElementById('completed').textContent = totalCompleted;
            document.getElementById('progressFill').style.width = totalCompleted + '%';
            
            if (totalCompleted === 100) {
                document.getElementById('completeBtn').disabled = false;
                document.getElementById('virtualKeyboard').style.display = 'none';
            } else {
                setTimeout(function() {
                    for (var i = index + 1; i < 100; i++) {
                        if (!quizData[i].completed) {
                            var nextInput = document.getElementById('input-' + i);
                            if (nextInput) {
                                activateInput(nextInput, i);
                                nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                break;
                            }
                        }
                    }
                }, 500);
            }
        }
    </script>
</body>
</html>
