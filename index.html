<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IntervalQuiz">
    <meta name="theme-color" content="#1e293b">
    <title>IntervalQuiz - Scale Intervals Trainer</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            color: white;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scale-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .scale-select-wrapper {
            flex: 1;
            min-width: 150px;
        }

        .scale-select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scale-select option {
            background: #1e293b;
            color: white;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: rgba(167, 139, 250, 0.2);
            border: 2px solid rgba(167, 139, 250, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background: rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9em;
            gap: 15px;
            flex-wrap: wrap;
        }

        .scale-name {
            color: #60a5fa;
            font-weight: bold;
            font-size: 1.1em;
        }

        .score-stats {
            display: flex;
            gap: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .quiz-area {
            height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Stile scrollbar per webkit browsers */
        .quiz-area::-webkit-scrollbar {
            width: 8px;
        }

        .quiz-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .quiz-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .quiz-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .start-message {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        .intervals-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .interval-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 5px;
        }

        .interval-label {
            width: 100%;
            padding: 6px 2px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px 8px 0 0;
            text-align: center;
            font-weight: bold;
            font-size: 0.8em;
        }

        .interval-input {
            width: 100%;
            padding: 8px 2px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 8px 8px;
            color: white;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .interval-input.active {
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        .interval-input.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
            color: #22c55e;
        }

        .interval-input.incorrect {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        .interval-input.show-answer {
            background: rgba(251, 191, 36, 0.3);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(96, 165, 250, 0.3);
        }

        .virtual-keyboard {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .keyboard-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .key-btn {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 50px;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .key-btn:active {
            transform: translateY(0);
            background: rgba(96, 165, 250, 0.3);
        }

        .key-btn.note {
            background: rgba(96, 165, 250, 0.2);
            border-color: rgba(96, 165, 250, 0.4);
        }

        .key-btn.accidental {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.4);
        }

        .key-btn.action {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .key-btn.enter {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
            padding: 15px 30px;
        }

        .current-input {
            text-align: center;
            margin-bottom: 15px;
            font-size: 24px;
            color: #60a5fa;
            min-height: 40px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 2px solid rgba(96, 165, 250, 0.3);
        }

        .nav-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .complete-btn {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
        }

        .complete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 IntervalQuiz</h1>
        
        <div class="scale-selector" id="scaleSelector">
            <div class="scale-select-wrapper">
                <select class="scale-select" id="scaleSelect">
                    <option value="">Seleziona una scala...</option>
                    <option value="C">C maggiore</option>
                    <option value="G">G maggiore</option>
                    <option value="D">D maggiore</option>
                    <option value="A">A maggiore</option>
                    <option value="E">E maggiore</option>
                    <option value="B">B maggiore</option>
                    <option value="F#">F# maggiore</option>
                    <option value="F">F maggiore</option>
                    <option value="Bb">Bb maggiore</option>
                    <option value="Eb">Eb maggiore</option>
                    <option value="Ab">Ab maggiore</option>
                    <option value="Db">Db maggiore</option>
                    <option value="Gb">Gb maggiore</option>
                </select>
            </div>
            <button class="btn" id="randomBtn">
                🎲 Scala Casuale
            </button>
        </div>
        
        <div class="score-container">
            <span class="scale-name hidden" id="scaleName"></span>
            <div class="score-stats">
                <span>Completate: <strong id="completed">0</strong>/100</span>
                <span>Corrette: <strong id="score">0</strong>/100</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-area" id="quizArea">
            <div class="start-message">
                Seleziona una scala o clicca su "Scala Casuale" per iniziare
            </div>
        </div>

        <button class="start-btn hidden" id="startBtn">
            🚀 Inizia Quiz
        </button>

        <div class="virtual-keyboard" id="virtualKeyboard">
            <div class="current-input" id="currentInput">_</div>
            
            <div class="keyboard-row">
                <button class="key-btn note" data-note="C">C</button>
                <button class="key-btn note" data-note="D">D</button>
                <button class="key-btn note" data-note="E">E</button>
                <button class="key-btn note" data-note="F">F</button>
                <button class="key-btn note" data-note="G">G</button>
                <button class="key-btn note" data-note="A">A</button>
                <button class="key-btn note" data-note="B">B</button>
            </div>
            
            <div class="keyboard-row">
                <button class="key-btn accidental" data-note="#">#</button>
                <button class="key-btn accidental" data-note="b">b</button>
                <button class="key-btn action" data-action="clear">⌫</button>
                <button class="key-btn enter" data-action="enter">✓ OK</button>
            </div>
        </div>

        <div class="nav-btns hidden" id="navBtns">
            <button class="nav-btn back-btn" id="backBtn">
                ← Torna al Menu
            </button>
            <button class="nav-btn complete-btn" id="completeBtn" disabled>
                Termina Quiz
            </button>
        </div>
    </div>

    <script>
        var scales = {
            'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G': ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
            'D': ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
            'A': ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
            'E': ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
            'B': ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'],
            'F': ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
            'Gb': ['Gb', 'Ab', 'Bb', 'Cb', 'Db', 'Eb', 'F'],
            'F#': ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#']
        };

        var intervalTypes = ['1', 'b2', '2', 'b3', '3', '4', 'b5', '5', '#5', '6', 'b7', '7'];
        
        var currentScale = '';
        var totalScore = 0;
        var totalCompleted = 0;
        var quizData = [];
        var currentActiveInput = null;
        var currentInputValue = '';
        var autoAdvanceTimer = null;

        document.getElementById('scaleSelect').addEventListener('change', function() {
            var selected = this.value;
            if (selected) {
                currentScale = selected;
                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('quizArea').innerHTML = 
                    '<div class="start-message">' +
                        'Premi "Inizia Quiz" per cominciare con la scala di ' + currentScale + ' maggiore' +
                    '</div>';
            }
        });

        document.getElementById('randomBtn').addEventListener('click', function() {
            var keys = Object.keys(scales);
            currentScale = keys[Math.floor(Math.random() * keys.length)];
            document.getElementById('scaleSelect').value = currentScale;
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('quizArea').innerHTML = 
                '<div class="start-message">' +
                    'Premi "Inizia Quiz" per cominciare con la scala di ' + currentScale + ' maggiore' +
                '</div>';
        });

        document.getElementById('startBtn').addEventListener('click', function() {
            generateQuiz();
            displayQuiz();
            this.classList.add('hidden');
            document.getElementById('navBtns').classList.remove('hidden');
            
            // Nasconde il selettore della scala e mostra il nome nella riga dei punteggi
            document.getElementById('scaleSelector').classList.add('hidden');
            document.getElementById('scaleName').textContent = 'Scala: ' + currentScale + ' maggiore';
            document.getElementById('scaleName').classList.remove('hidden');
        });

        document.getElementById('backBtn').addEventListener('click', function() {
            if (confirm('Vuoi tornare al menu? Perderai i progressi attuali.')) {
                location.reload();
            }
        });

        document.getElementById('completeBtn').addEventListener('click', function() {
            alert('Quiz completato!\nPunteggio: ' + totalScore + '/100\nPercentuale: ' + totalScore + '%');
            location.reload();
        });

        var keyButtons = document.querySelectorAll('.key-btn');
        for (var i = 0; i < keyButtons.length; i++) {
            keyButtons[i].addEventListener('click', function() {
                if (!currentActiveInput) return;
                
                var note = this.dataset.note;
                var action = this.dataset.action;
                
                if (note) {
                    if (note === '#' || note === 'b') {
                        if (currentInputValue.length === 1 && currentInputValue.indexOf('#') === -1 && currentInputValue.indexOf('b') === -1) {
                            currentInputValue += note;
                            updateDisplay();
                            
                            clearTimeout(autoAdvanceTimer);
                            autoAdvanceTimer = setTimeout(function() {
                                if (currentActiveInput) {
                                    var index = parseInt(currentActiveInput.id.split('-')[1]);
                                    checkAnswer(index);
                                }
                            }, 300);
                        }
                    } else {
                        currentInputValue = note;
                        updateDisplay();
                        
                        clearTimeout(autoAdvanceTimer);
                        autoAdvanceTimer = setTimeout(function() {
                            if (currentInputValue.length === 1 && currentActiveInput) {
                                var index = parseInt(currentActiveInput.id.split('-')[1]);
                                checkAnswer(index);
                            }
                        }, 1500);
                    }
                } else if (action === 'clear') {
                    currentInputValue = '';
                    updateDisplay();
                    clearTimeout(autoAdvanceTimer);
                } else if (action === 'enter') {
                    if (currentInputValue && currentActiveInput) {
                        clearTimeout(autoAdvanceTimer);
                        var index = parseInt(currentActiveInput.id.split('-')[1]);
                        checkAnswer(index);
                    }
                }
            });
        }

        function updateDisplay() {
            document.getElementById('currentInput').textContent = currentInputValue || '_';
            if (currentActiveInput) {
                currentActiveInput.textContent = currentInputValue;
            }
        }

        function generateQuiz() {
            quizData = [];
            for (var i = 0; i < 100; i++) {
                var interval = intervalTypes[Math.floor(Math.random() * intervalTypes.length)];
                quizData.push({
                    interval: interval,
                    answer: calculateInterval(currentScale, interval),
                    userAnswer: '',
                    completed: false
                });
            }
        }

        function calculateInterval(scaleName, interval) {
            var scale = scales[scaleName];
            
            if (interval === '1') return scale[0];
            if (interval === '2') return scale[1];
            if (interval === '3') return scale[2];
            if (interval === '4') return scale[3];
            if (interval === '5') return scale[4];
            if (interval === '6') return scale[5];
            if (interval === '7') return scale[6];
            
            if (interval === 'b2') return flatNote(scale[1]);
            if (interval === 'b3') return flatNote(scale[2]);
            if (interval === 'b5') return flatNote(scale[4]);
            if (interval === '#5') return sharpNote(scale[4]);
            if (interval === 'b7') return flatNote(scale[6]);
            
            return scale[0];
        }

        function sharpNote(note) {
            if (note.indexOf('#') !== -1) return note.charAt(0) + '##';
            if (note.indexOf('b') !== -1) return note.charAt(0);
            if (note === 'E') return 'F';
            if (note === 'B') return 'C';
            return note + '#';
        }

        function flatNote(note) {
            if (note.indexOf('b') !== -1) return note.charAt(0) + 'bb';
            if (note.indexOf('#') !== -1) return note.charAt(0);
            if (note === 'C') return 'B';
            if (note === 'F') return 'E';
            return note + 'b';
        }

        function displayQuiz() {
            var area = document.getElementById('quizArea');
            area.innerHTML = '';
            
            var grid = document.createElement('div');
            grid.className = 'intervals-grid';
            
            for (var i = 0; i < quizData.length; i++) {
                var quiz = quizData[i];
                var group = document.createElement('div');
                group.className = 'interval-group';
                
                var label = document.createElement('div');
                label.className = 'interval-label';
                label.textContent = quiz.interval;
                
                var input = document.createElement('div');
                input.className = 'interval-input';
                input.id = 'input-' + i;
                input.textContent = '';
                input.tabIndex = 0;
                
                input.addEventListener('click', (function(index) {
                    return function() {
                        if (!quizData[index].completed) {
                            activateInput(this, index);
                        }
                    };
                })(i));
                
                group.appendChild(label);
                group.appendChild(input);
                grid.appendChild(group);
            }
            
            area.appendChild(grid);
            document.getElementById('virtualKeyboard').style.display = 'block';
            
            setTimeout(function() {
                var firstInput = document.getElementById('input-0');
                if (firstInput) {
                    activateInput(firstInput, 0);
                }
            }, 100);
        }

        function activateInput(input, index) {
            var inputs = document.querySelectorAll('.interval-input');
            for (var i = 0; i < inputs.length; i++) {
                inputs[i].classList.remove('active');
            }
            
            if (!quizData[index].completed) {
                input.classList.add('active');
                currentActiveInput = input;
                currentInputValue = input.textContent || '';
                document.getElementById('currentInput').textContent = currentInputValue || '_';
            }
        }

        function checkAnswer(index) {
            var input = document.getElementById('input-' + index);
            var userAnswer = currentInputValue.trim();
            var correct = quizData[index].answer;
            
            var enharmonics = {
                'C#': 'Db', 'Db': 'C#',
                'D#': 'Eb', 'Eb': 'D#',
                'F#': 'Gb', 'Gb': 'F#',
                'G#': 'Ab', 'Ab': 'G#',
                'A#': 'Bb', 'Bb': 'A#',
                'E#': 'F', 'F': 'E#',
                'B#': 'C', 'C': 'B#',
                'Cb': 'B', 'B': 'Cb',
                'Fb': 'E', 'E': 'Fb'
            };
            
            var isCorrect = userAnswer === correct || 
                           (enharmonics[userAnswer] === correct) || 
                           (enharmonics[correct] === userAnswer);
            
            if (isCorrect) {
                input.classList.add('correct');
                input.classList.remove('active');
                totalScore++;
                document.getElementById('score').textContent = totalScore;
            } else {
                input.classList.add('incorrect');
                input.classList.remove('active');
                setTimeout(function() {
                    input.classList.remove('incorrect');
                    input.classList.add('show-answer');
                    input.textContent = correct;
                }, 1000);
            }
            
            quizData[index].completed = true;
            totalCompleted++;
            currentActiveInput = null;
            currentInputValue = '';
            document.getElementById('currentInput').textContent = '_';
            
            document.getElementById('completed').textContent = totalCompleted;
            document.getElementById('progressFill').style.width = totalCompleted + '%';
            
            if (totalCompleted === 100) {
                document.getElementById('completeBtn').disabled = false;
                document.getElementById('virtualKeyboard').style.display = 'none';
            } else {
                setTimeout(function() {
                    for (var i = index + 1; i < 100; i++) {
                        if (!quizData[i].completed) {
                            var nextInput = document.getElementById('input-' + i);
                            if (nextInput) {
                                activateInput(nextInput, i);
                                nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                break;
                            }
                        }
                    }
                }, 500);
            }
        }
    </script>
</body>
</html>
