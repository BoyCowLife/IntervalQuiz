<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IntervalQuiz">
    <meta name="theme-color" content="#1e293b">
    <title>IntervalQuiz - Scale Intervals Trainer</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            color: white;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scale-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .scale-select-wrapper {
            flex: 1;
            min-width: 150px;
        }

        .scale-select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scale-select option {
            background: #1e293b;
            color: white;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: rgba(167, 139, 250, 0.2);
            border: 2px solid rgba(167, 139, 250, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background: rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9em;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .scale-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(96, 165, 250, 0.2);
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            border: 2px solid rgba(96, 165, 250, 0.3);
        }

        .quiz-area {
            min-height: 200px;
            max-height: calc(100vh - 400px);
            overflow-y: auto;
            padding: 20px 10px;
            margin-bottom: 20px;
        }

        .start-message {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        .intervals-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .interval-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .interval-label {
            width: 100%;
            padding: 6px 2px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px 8px 0 0;
            text-align: center;
            font-weight: bold;
            font-size: 0.8em;
        }

        .interval-input {
            width: 100%;
            padding: 10px 2px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 8px 8px;
            color: white;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .interval-input:focus {
            outline: none;
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
        }

        .interval-input.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
        }

        .interval-input.incorrect {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }

        .interval-input.show-answer {
            background: rgba(251, 191, 36, 0.3);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(96, 165, 250, 0.3);
        }

        .nav-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .complete-btn {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
        }

        .complete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 IntervalQuiz</h1>
        
        <div class="scale-selector">
            <div class="scale-select-wrapper">
                <select class="scale-select" id="scaleSelect">
                    <option value="">Seleziona una scala...</option>
                    <option value="C">C maggiore</option>
                    <option value="G">G maggiore</option>
                    <option value="D">D maggiore</option>
                    <option value="A">A maggiore</option>
                    <option value="E">E maggiore</option>
                    <option value="B">B maggiore</option>
                    <option value="F#">F# maggiore</option>
                    <option value="F">F maggiore</option>
                    <option value="Bb">Bb maggiore</option>
                    <option value="Eb">Eb maggiore</option>
                    <option value="Ab">Ab maggiore</option>
                    <option value="Db">Db maggiore</option>
                    <option value="Gb">Gb maggiore</option>
                </select>
            </div>
            <button class="btn" id="randomBtn">
                🎲 Scala Casuale
            </button>
        </div>
        
        <div class="score-container">
            <span>Completate: <strong id="completed">0</strong>/100</span>
            <span>Corrette: <strong id="score">0</strong>/100</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="scale-info">
            Scala: <span id="currentScale" style="font-size: 1.3em; color: #60a5fa;">---</span> maggiore
        </div>

        <div class="quiz-area" id="quizArea">
            <div class="start-message">
                Seleziona una scala o clicca su "Scala Casuale" per iniziare
            </div>
        </div>

        <button class="start-btn hidden" id="startBtn">
            🚀 Inizia Quiz
        </button>

        <div class="nav-btns hidden" id="navBtns">
            <button class="nav-btn back-btn" id="backBtn">
                ← Torna al Menu
            </button>
            <button class="nav-btn complete-btn" id="completeBtn" disabled>
                Termina Quiz
            </button>
        </div>
    </div>

    <script>
        // Scale maggiori
        const scales = {
            'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G': ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
            'D': ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
            'A': ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
            'E': ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
            'B': ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'],
            'F': ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
            'Gb': ['Gb', 'Ab', 'Bb', 'Cb', 'Db', 'Eb', 'F'],
            'F#': ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#']
        };

        const intervalTypes = ['1', 'b2', '2', 'b3', '3', '4', 'b5', '5', '#5', '6', 'b7', '7'];
        
        let currentScale = '';
        let totalScore = 0;
        let totalCompleted = 0;
        let quizData = [];

        // Selezione scala dal dropdown
        document.getElementById('scaleSelect').addEventListener('change', function() {
            const selected = this.value;
            if (selected) {
                currentScale = selected;
                document.getElementById('currentScale').textContent = currentScale;
                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('quizArea').innerHTML = `
                    <div class="start-message">
                        Premi "Inizia Quiz" per cominciare con la scala di ${currentScale} maggiore
                    </div>
                `;
            }
        });

        // Scala casuale
        document.getElementById('randomBtn').addEventListener('click', function() {
            const keys = Object.keys(scales);
            currentScale = keys[Math.floor(Math.random() * keys.length)];
            document.getElementById('scaleSelect').value = currentScale;
            document.getElementById('currentScale').textContent = currentScale;
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('quizArea').innerHTML = `
                <div class="start-message">
                    Premi "Inizia Quiz" per cominciare con la scala di ${currentScale} maggiore
                </div>
            `;
        });

        // Inizia quiz
        document.getElementById('startBtn').addEventListener('click', function() {
            generateQuiz();
            displayQuiz();
            this.classList.add('hidden');
            document.getElementById('navBtns').classList.remove('hidden');
        });

        // Torna al menu
        document.getElementById('backBtn').addEventListener('click', function() {
            if (confirm('Vuoi tornare al menu? Perderai i progressi attuali.')) {
                location.reload();
            }
        });

        // Termina quiz
        document.getElementById('completeBtn').addEventListener('click', function() {
            alert(`Quiz completato!\nPunteggio: ${totalScore}/100\nPercentuale: ${totalScore}%`);
            location.reload();
        });

        function generateQuiz() {
            quizData = [];
            for (let i = 0; i < 100; i++) {
                const interval = intervalTypes[Math.floor(Math.random() * intervalTypes.length)];
                quizData.push({
                    interval: interval,
                    answer: calculateInterval(currentScale, interval),
                    userAnswer: '',
                    completed: false
                });
            }
        }

        function calculateInterval(scaleName, interval) {
            const scale = scales[scaleName];
            const mapping = {
                '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6,
                'b2': 1, 'b3': 2, 'b5': 4, '#5': 4, 'b7': 6
            };
            
            const degree = mapping[interval];
            let note = scale[degree];
            
            // Applica alterazioni
            if (interval.includes('b') && interval !== '1') {
                note = flatNote(scale[degree]);
            } else if (interval === '#5') {
                note = sharpNote(scale[4]);
            }
            
            return note;
        }

        function sharpNote(note) {
            if (note.includes('#')) return note[0] + '##';
            if (note.includes('b')) return note[0];
            if (note === 'E') return 'F';
            if (note === 'B') return 'C';
            return note + '#';
        }

        function flatNote(note) {
            if (note.includes('b')) return note[0] + 'bb';
            if (note.includes('#')) return note[0];
            if (note === 'C') return 'B';
            if (note === 'F') return 'E';
            return note + 'b';
        }

        function displayQuiz() {
            const area = document.getElementById('quizArea');
            area.innerHTML = '';
            
            const grid = document.createElement('div');
            grid.className = 'intervals-grid';
            
            quizData.forEach((quiz, index) => {
                const group = document.createElement('div');
                group.className = 'interval-group';
                
                const label = document.createElement('div');
                label.className = 'interval-label';
                label.textContent = quiz.interval;
                
                const input = document.createElement('input');
                input.className = 'interval-input';
                input.type = 'text';
                input.maxLength = 4;
                input.id = `input-${index}`;
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && this.value) {
                        checkAnswer(index);
                    }
                });
                
                group.appendChild(label);
                group.appendChild(input);
                grid.appendChild(group);
            });
            
            area.appendChild(grid);
            document.getElementById('input-0').focus();
        }

        function checkAnswer(index) {
            const input = document.getElementById(`input-${index}`);
            const userAnswer = input.value.toUpperCase();
            const correct = quizData[index].answer;
            
            if (userAnswer === correct) {
                input.classList.add('correct');
                totalScore++;
                document.getElementById('score').textContent = totalScore;
            } else {
                input.classList.add('incorrect');
                setTimeout(() => {
                    input.classList.remove('incorrect');
                    input.classList.add('show-answer');
                    input.value = correct;
                }, 1000);
            }
            
            input.disabled = true;
            quizData[index].completed = true;
            totalCompleted++;
            
            document.getElementById('completed').textContent = totalCompleted;
            document.getElementById('progressFill').style.width = totalCompleted + '%';
            
            if (totalCompleted === 100) {
                document.getElementById('completeBtn').disabled = false;
            } else {
                // Focus sul prossimo
                const nextIndex = index + 1;
                if (nextIndex < 100 && document.getElementById(`input-${nextIndex}`)) {
                    setTimeout(() => {
                        document.getElementById(`input-${nextIndex}`).focus();
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
